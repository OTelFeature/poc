# Flagsmith mode (FR-027, UC-008 A4): the flags are authored in Flagsmith,
# not in src/flagd/flagd.json. Opt-in, online only, not the stage default
# (UC-008 BR-012, OQ-16):
#
#   export FLAGSMITH_SERVER_KEY=ser.… FLAGSMITH_CLIENT_KEY=… \
#          FLAGSMITH_API_KEY=… FLAGSMITH_PROJECT=…
#   docker compose -f compose.yaml -f compose.flagsmith.yaml pull flagsmith-proxy
#   docker compose -f compose.yaml -f compose.flagsmith.yaml run --rm flagsmith-flag seed
#   docker compose -f compose.yaml -f compose.flagsmith.yaml up -d
#   docker compose -f compose.yaml -f compose.flagsmith.yaml run --rm flagsmith-flag 03a-weather-boost
#
# The Flagsmith proxy (src/flagsmith-proxy) holds the environment document,
# refreshed on each real-time event, and serves it to flagd as a flag set;
# flagd polls it every second with the client-side key and still pushes to
# both services over gRPC sync (C-002). Its image is published from main
# like the others (images.yml, NFR-017) and bakes in src/flagd/presets, so
# `build` it for a local change, presets included. See
# src/flagsmith-proxy/README.md.

x-flagsmith-keys: &flagsmith-keys
  FLAGSMITH_SERVER_KEY: ${FLAGSMITH_SERVER_KEY:?set FLAGSMITH_SERVER_KEY to the environment's server-side key}
  FLAGSMITH_CLIENT_KEY: ${FLAGSMITH_CLIENT_KEY:?set FLAGSMITH_CLIENT_KEY to the environment's client-side key}
  FLAGSMITH_EDGE_API_URL: ${FLAGSMITH_EDGE_API_URL:-https://edge.api.flagsmith.com/api/v1}

services:
  flagsmith-proxy:
    image: ghcr.io/otelfeature/poc-flagsmith-proxy:${POC_IMAGE_TAG:-main}
    build:
      context: ./src
      dockerfile: flagsmith-proxy/Dockerfile
    container_name: flagsmith-proxy
    environment:
      <<: *flagsmith-keys
      ENVIRONMENT_KEY_PAIRS: '[{"server_side_key":"${FLAGSMITH_SERVER_KEY}","client_side_key":"${FLAGSMITH_CLIENT_KEY}"}]'
      API_URL: ${FLAGSMITH_EDGE_API_URL:-https://edge.api.flagsmith.com/api/v1}
      API_POLL_FREQUENCY_SECONDS: ${FLAGSMITH_POLL_SECONDS:-60}
      FLAGSMITH_REALTIME_URL: ${FLAGSMITH_REALTIME_URL-https://realtime.flagsmith.com/}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/proxy/health/readiness', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  flagd:
    command: [
      "start",
      "--sources",
      '[{"uri":"http://flagsmith-proxy:8000/api/v1/flagd/flags.json","provider":"http","authHeader":"Bearer ${FLAGSMITH_CLIENT_KEY}","interval":1}]'
    ]
    volumes: !reset []
    depends_on:
      flagsmith-proxy:
        condition: service_healthy

  # Stage control in Flagsmith mode, the counterpart of the `flag` service:
  #   docker compose -f compose.yaml -f compose.flagsmith.yaml run --rm flagsmith-flag <preset>
  # Writes the preset with the Flagsmith CLI and waits until flagd serves it
  # (UC-008 BR-010). Also `seed`, `plan <preset>` and `check [<preset>]`.
  flagsmith-flag:
    image: ghcr.io/otelfeature/poc-flagsmith-proxy:${POC_IMAGE_TAG:-main}
    profiles: [tools]
    entrypoint: ["python", "-m", "otelfeature_flagsmith.preset"]
    environment:
      <<: *flagsmith-keys
      FLAGSMITH_PROXY_URL: http://flagsmith-proxy:8000
      FLAGSMITH_API_KEY: ${FLAGSMITH_API_KEY:-}
      FLAGSMITH_PROJECT: ${FLAGSMITH_PROJECT:-}
      FLAGSMITH_ENVIRONMENT: ${FLAGSMITH_CLIENT_KEY}
      FLAGSMITH_NO_INPUT: "1"
      FLAGD_OFREP_URL: http://flagd:8016
      FLAG_CONFIRM_TIMEOUT: ${FLAG_CONFIRM_TIMEOUT:-10}
