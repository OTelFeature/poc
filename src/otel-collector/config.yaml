receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_GRPC}
      http:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
  docker_stats:
    endpoint: unix:///var/run/docker.sock

processors:
  # Only fills deployment.environment.name for senders that don't set it
  # (flagd, k6, docker_stats). geocode and weather set their own
  # (production/staging) and the flag decisions in the SDK depend on it, so
  # the collector must never overwrite it.
  resource:
    attributes:
      - key: deployment.environment.name
        value: "otelfeature"
        action: insert
  transform:
    error_mode: ignore
    metric_statements:
      - context: scope
        conditions:
          - name == "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/dockerstatsreceiver"
        statements:
          - set(resource.attributes["service.name"], "docker-stats")
  cumulativetodelta: {}

connectors:
  span_metrics: {}

exporters:
  debug: {}
  otlp_grpc/aspire:
    endpoint: "http://aspire-dashboard:18889"
    tls:
      insecure: true
    sending_queue:
      batch:
  otlp_http/datadog:
    endpoint: "https://otlp.${env:DD_SITE}/"
    headers:
      dd-api-key: ${env:DD_API_KEY}
      dd-otel-metric-config: '{"resource_attributes_as_tags": true}'
      dd-otel-span-mapping: '{span_name_as_resource_name: true}'
      compute_stats: 'true'
    sending_queue:
      batch:
        min_size: 10
        max_size: 100
        flush_timeout: 10s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource]
      exporters: [debug, otlp_grpc/aspire, span_metrics, otlp_http/datadog]
    metrics:
      receivers: [otlp, span_metrics, docker_stats]
      processors: [transform, resource, cumulativetodelta]
      exporters: [debug, otlp_grpc/aspire, otlp_http/datadog]
    logs:
      receivers: [otlp]
      processors: [resource]
      exporters: [debug, otlp_grpc/aspire, otlp_http/datadog]

  telemetry:
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: grpc
                endpoint: http://aspire-dashboard:18889
                insecure: true
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: grpc
                endpoint: http://aspire-dashboard:18889
                insecure: true
