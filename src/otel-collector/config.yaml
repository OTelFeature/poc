receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_GRPC}
      http:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
  docker_stats:
    endpoint: unix:///var/run/docker.sock

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1000
  # Only fills deployment.environment.name for senders that don't set it
  # (flagd, k6, docker_stats). geocode and weather set their own
  # (production/staging) and the flag decisions in the SDK depend on it, so
  # the collector must never overwrite it.
  resource:
    attributes:
      - key: deployment.environment.name
        value: "otelfeature"
        action: insert
  transform:
    error_mode: ignore
    metric_statements:
      - context: scope
        conditions:
          - name == "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/dockerstatsreceiver"
        statements:
          - set(resource.attributes["service.name"], "docker-stats")

connectors:
  span_metrics: {}

exporters:
  debug: {}
  otlp_grpc/aspire:
    endpoint: "http://aspire-dashboard:18889"
    tls:
      insecure: true
    sending_queue:
      batch:

# Dash0, opt-in per laptop (C-016): dash0.yaml, merged on top of this file
# by compose.dash0.yaml, adds traces/dash0, metrics/dash0 and logs/dash0 with
# the same receivers and processors as these. Keep those in step.
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource]
      exporters: [debug, otlp_grpc/aspire, span_metrics]
    metrics:
      receivers: [otlp, span_metrics, docker_stats]
      processors: [memory_limiter, transform, resource]
      exporters: [debug, otlp_grpc/aspire]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource]
      exporters: [debug, otlp_grpc/aspire]

  telemetry:
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: grpc
                endpoint: http://aspire-dashboard:18889
                insecure: true
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: grpc
                endpoint: http://aspire-dashboard:18889
                insecure: true
