server.port=${WEATHER_PORT:8001}
spring.main.banner-mode=off
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:coordinates-db}:${POSTGRES_PORT:5432}/${POSTGRES_DB:coordinates}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PWD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
weather.open-meteo.geocoding-url=${OPEN_METEO_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
weather.open-meteo.forecast-url=${OPEN_METEO_FORECAST_URL:https://api.open-meteo.com/v1/forecast}
logging.level.otelfeature.poc=DEBUG
