plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'otelfeature.poc'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    runtimeOnly 'org.postgresql:postgresql'
    // Application-level feature flags (fault injection). Same versions as
    // otelfeature-java-extension uses for its own, isolated client.
    implementation 'dev.openfeature:sdk:1.23.0'
    implementation 'dev.openfeature.contrib.providers:flagd:0.14.2'
}
