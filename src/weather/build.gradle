plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'otelfeature.poc'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'
    runtimeOnly 'org.postgresql:postgresql'
    // Application-level feature flags (fault injection). SDK and provider
    // match otelfeature-java-extension's own (isolated) client. flagd-core is
    // pinned because the provider asks for a range ([2.0.0,3.0.0)); gRPC,
    // protobuf and Jackson versions are managed by Spring Boot.
    implementation 'dev.openfeature:sdk:1.23.0'
    implementation 'dev.openfeature.contrib.providers:flagd:0.15.0'
    implementation 'dev.openfeature.contrib.tools:flagd-core:2.0.4'
    // OpenFeature OpenTelemetry hook: flag evaluations as span events (UC-007).
    implementation 'dev.openfeature.contrib.hooks:otel:3.3.1'
    constraints {
        // The hook takes its attribute names from semconv-incubating: 1.28
        // gives feature_flag.variant / feature_flag.provider_name, which the
        // spec (UC-007 BR-004) and the e2e test expect. Newer releases rename
        // them, so a bump is a spec change.
        implementation('io.opentelemetry.semconv:opentelemetry-semconv-incubating') {
            version { strictly '1.28.0-alpha' }
        }
    }
    // Unit tests (FaultInjectionTest, OTelFeature/poc#75). Not in the Docker
    // dependency layer: the image builds with -x test, and the Dockerfile's
    // test stage (make unit-test) downloads them itself.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}

// For the Docker dependency layer (Dockerfile): resolves, and so downloads,
// every artifact the build needs, before the sources are copied in. The
// Dockerfile then builds --offline, so anything missed here fails the build.
tasks.register('downloadDependencies') {
    def deps = files(configurations.compileClasspath, configurations.annotationProcessor,
                     configurations.productionRuntimeClasspath)
    inputs.files(deps)
    doLast { deps.files.size() }
}
