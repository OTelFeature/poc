# Test override for the end-to-end suite (tests/e2e, OTelFeature/poc#35).
# Use it through `make e2e`, which runs it as its own compose project
# (`otelfeature-e2e`), so it never touches a running demo stack:
#
#   docker compose -p otelfeature-e2e -f compose.yaml -f compose.e2e.yaml ...
#
# What it changes:
# - every service built from this repo is built here under a local image
#   name (otelfeature-e2e-*), never pulled from GHCR: the suite tests the
#   code of the checkout (NFR-017)
# - geocode and weather use the pinned extension releases by default, like
#   the stage (C-006, C-013). `make e2e OTELFEATURE_INSTRUMENT_REF=<ref>` /
#   `OTELFEATURE_EXTENSION_REF=<ref>` builds an extension from a git ref
#   instead (the Makefile sets the matching *_SOURCE), to test unreleased
#   extension code. Without make, set OTELFEATURE_*_SOURCE=git too, or the
#   ref is ignored and the pinned release is built
# - no fixed container names or host ports, own network
# - the collector writes every span to a JSON file on the e2e-out volume
#   (tests/e2e/collector.yaml); no Aspire, no Datadog, no docker_stats
# - flagd reads its flags from the e2e-flags volume, which the tests rewrite;
#   src/flagd/flagd.json is never modified
# - no load generator: the tests send every request themselves
# - fast span export, and the tests' marker header recorded on server spans

networks:
  default:
    name: otelfeature-e2e

volumes:
  e2e-flags:
  e2e-out:

# e2e additions to the services' environment, shared by the normal and the
# hard-floor instances (which extend compose.yaml's services, so these are
# merged on top of the base environment there too).
x-geocode-e2e-env: &geocode-e2e-env
  OTEL_BSP_SCHEDULE_DELAY: "100"
  OTEL_METRIC_EXPORT_INTERVAL: "1000"
  OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_SERVER_REQUEST: x-e2e-step
  # Short error-rate window for the control-loop test (TC-005); seconds.
  OTELFEATURE_ERROR_RATE_INTERVAL: "2"
  OTELFEATURE_ERROR_RATE_MIN_REQUESTS: "5"

x-weather-e2e-env: &weather-e2e-env
  OTEL_BSP_SCHEDULE_DELAY: "100"
  OTEL_METRIC_EXPORT_INTERVAL: "1000"
  OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS: x-e2e-step
  OTELFEATURE_ENFORCEMENT: ${OTELFEATURE_ENFORCEMENT:-processor}
  OTELFEATURE_ERROR_RATE_INTERVAL: "2"
  OTELFEATURE_ERROR_RATE_MIN_REQUESTS: "5"
  # Faster JVM start (OTelFeature/poc#70): four weather JVMs start at once
  # and took 85-100 s to get healthy on a CI runner. C1 only and the serial
  # GC trade peak throughput, which the suite doesn't need, for start time.
  # The bench resets it (compose.bench.yaml), so it measures the stage JVM.
  JAVA_TOOL_OPTIONS: "-XX:TieredStopAtLevel=1 -XX:+UseSerialGC"

x-geocode-floor: &geocode-floor
  extends: {file: compose.yaml, service: geocode}
  image: otelfeature-e2e-geocode
  pull_policy: never

x-weather-floor: &weather-floor
  extends: {file: compose.yaml, service: weather}
  image: otelfeature-e2e-weather
  pull_policy: never

services:
  geocode:
    # Pinned image name: the hard-floor instances below run this image.
    image: otelfeature-e2e-geocode
    container_name: !reset null
    ports: !reset []
    build:
      args:
        OTELFEATURE_INSTRUMENT_SOURCE: ${OTELFEATURE_INSTRUMENT_SOURCE:-lock}
        OTELFEATURE_INSTRUMENT_REF: ${OTELFEATURE_INSTRUMENT_REF:-main}
    environment: *geocode-e2e-env

  weather:
    image: otelfeature-e2e-weather
    container_name: !reset null
    ports: !reset []
    build:
      args:
        OTELFEATURE_EXTENSION_SOURCE: ${OTELFEATURE_EXTENSION_SOURCE:-release}
        OTELFEATURE_EXTENSION_REF: ${OTELFEATURE_EXTENSION_REF:-main}
    environment: *weather-e2e-env

  # Staging twins (TC-004), always on in the e2e project: same image as
  # geocode, deployment.environment.name=staging.
  geocode-staging:
    profiles: !reset []
    image: otelfeature-e2e-geocode
    build: !reset null
    pull_policy: never
    container_name: !reset null
    ports: !reset []
    environment:
      <<: *geocode-e2e-env

  # Staging twins (TC-004), always on in the e2e project: same image as
  # weather, deployment.environment.name=staging.
  weather-staging:
    profiles: !reset []
    image: otelfeature-e2e-weather
    build: !reset null
    pull_policy: never
    container_name: !reset null
    ports: !reset []
    environment:
      <<: *weather-e2e-env

  stub-apis:
    image: otelfeature-e2e-stub-apis
    container_name: !reset null
    ports: !reset []
    environment:
      STUB_LATENCY_MIN_MS: "1"
      STUB_LATENCY_MAX_MS: "5"

  coordinates-db:
    container_name: !reset null
    ports: !reset []

  # Seeds the flags volume with the baseline preset before flagd starts.
  flags-init:
    image: busybox:1.38.0
    command: ["cp", "/presets/00-baseline.json", "/flags/flagd.json"]
    volumes:
      - ./src/flagd/presets:/presets:ro
      - e2e-flags:/flags

  flagd:
    container_name: !reset null
    ports: !reset []
    volumes: !override
      - e2e-flags:/etc/flagd
    depends_on:
      flags-init:
        condition: service_completed_successfully

  otel-collector:
    container_name: !reset null
    # Root to write spans into the fresh, root-owned e2e-out volume (the base
    # file also runs it as root, for docker_stats; don't depend on that).
    user: "0:0"
    ports: !reset []
    volumes: !override
      - ./tests/e2e/collector.yaml:/etc/otel-collector-config.yaml:ro
      - e2e-out:/out
    depends_on: !reset {}

  # Hard floors (test_hard_floors.py): the same services with an env var
  # that no flag may override. They run the images built for geocode/weather
  # (pinned names above) with their own service.instance.id.
  geocode-sdk-disabled:
    <<: *geocode-floor
    # Not in the anchor: YAML merge keys drop compose's !reset tags.
    build: !reset null
    container_name: !reset null
    ports: !reset []
    environment:
      <<: *geocode-e2e-env
      OTEL_SDK_DISABLED: "true"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.namespace=otelfeature,service.version=0.1.0,service.instance.id=geocode-sdk-disabled

  weather-sdk-disabled:
    <<: *weather-floor
    # Not in the anchor: YAML merge keys drop compose's !reset tags.
    build: !reset null
    container_name: !reset null
    ports: !reset []
    environment:
      <<: *weather-e2e-env
      OTEL_SDK_DISABLED: "true"
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.namespace=otelfeature,service.version=0.1.0,service.instance.id=weather-sdk-disabled

  geocode-always-off:
    <<: *geocode-floor
    # Not in the anchor: YAML merge keys drop compose's !reset tags.
    build: !reset null
    container_name: !reset null
    ports: !reset []
    environment:
      <<: *geocode-e2e-env
      OTEL_TRACES_SAMPLER: always_off
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.namespace=otelfeature,service.version=0.1.0,service.instance.id=geocode-always-off

  weather-always-off:
    <<: *weather-floor
    # Not in the anchor: YAML merge keys drop compose's !reset tags.
    build: !reset null
    container_name: !reset null
    ports: !reset []
    environment:
      <<: *weather-e2e-env
      OTEL_TRACES_SAMPLER: always_off
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.namespace=otelfeature,service.version=0.1.0,service.instance.id=weather-always-off

  aspire-dashboard:
    profiles: [never]

  load-generator:
    profiles: [never]

  load-generator-staging:
    profiles: [never]

  # The test runner (ci/Dockerfile): `docker compose ... --profile runner
  # run --rm e2e [pytest args]`. Reaches the services by name on the e2e
  # network, rewrites flags in e2e-flags, reads spans from e2e-out.
  e2e:
    profiles: [runner]
    # Pinned so a pre-built image (CI's bake step) is found by name.
    image: otelfeature-e2e-runner
    build:
      context: .
      dockerfile: ci/Dockerfile
    volumes:
      - ./tests/e2e:/e2e/tests:ro
      - ./src/flagd/presets:/presets:ro
      - e2e-flags:/flags
      - e2e-out:/out:ro
    environment:
      GEOCODE_URL: http://geocode:8000
      WEATHER_URL: http://weather:8001
      FLAGD_OFREP_URL: http://flagd:8016
      E2E_FLAGS_FILE: /flags/flagd.json
      E2E_PRESETS_DIR: /presets
      E2E_SPANS_FILE: /out/spans.jsonl
      E2E_METRICS_FILE: /out/metrics.jsonl
      E2E_QUIET_SECONDS: ${E2E_QUIET_SECONDS:-2.0}
      OTELFEATURE_ENFORCEMENT: ${OTELFEATURE_ENFORCEMENT:-processor}
