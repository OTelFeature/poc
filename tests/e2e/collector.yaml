# Collector config for the e2e suite (compose.e2e.yaml). Every span and
# every metric export the services send goes, unchanged, into a JSON-lines
# file the tests read (spans.jsonl, metrics.jsonl).
# No processors: the tests must see exactly what the SDKs sent (for example
# that deployment.environment.name comes from the service, not from here).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  file/spans:
    path: /out/spans.jsonl
    format: json
    flush_interval: 100ms
  file/metrics:
    path: /out/metrics.jsonl
    format: json
    flush_interval: 100ms
  nop: {}

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/spans]
    # Metrics: kept, so tests can check they keep flowing while tracing is
    # off (TC-001 step 2). Logs: accepted and dropped.
    metrics:
      receivers: [otlp]
      exporters: [file/metrics]
    logs:
      receivers: [otlp]
      exporters: [nop]
