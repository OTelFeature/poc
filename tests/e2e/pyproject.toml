[project]
name = "otelfeature-poc-e2e"
version = "0.1.0"
description = "End-to-end tests: the talk's demo beats against the running stack"
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-repeat==0.9.4",
    # Preset checks (`make test`): schema, and the flagd evaluator geocode
    # uses. Version in step with src/geocode/uv.lock.
    "check-jsonschema==0.39.0",
    "openfeature-provider-flagd==0.6.1",
    # Measurement harness (bench/): OTLP protobuf sizes per service.
    "opentelemetry-proto==1.45.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "slow: statistical or long-running, nightly only",
    "stage_run: the full stage run-through; main, nightly and manual runs, not pull requests",
]
