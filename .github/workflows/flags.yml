# Preset checks in the toolchain image (ci/Dockerfile): the same image and the
# same command as `make test` locally. No setup-uv on the runner (NFR-016).
name: flags

on:
  pull_request:
    paths:
      - "src/flagd/**"
      - "ci/**"
      - "tests/e2e/pyproject.toml"
      - "tests/e2e/uv.lock"
      - "Makefile"
      - ".github/workflows/flags.yml"
  push:
    branches: [main]
    paths:
      - "src/flagd/**"
      - "ci/**"
      - "tests/e2e/pyproject.toml"
      - "tests/e2e/uv.lock"
      - "Makefile"
      - ".github/workflows/flags.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      # Same image and cache scope as the e2e runner in e2e.yml: the
      # dependency layer is rebuilt only when the base image or the lock
      # files change.
      - name: Build the toolchain image (layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ci/Dockerfile
          tags: otelfeature-e2e-runner
          load: true
          cache-from: type=gha,scope=e2e-runner
          cache-to: type=gha,scope=e2e-runner,mode=max

      # Schema, flagd.json = 00-baseline, test_presets.py.
      - name: Preset checks
        run: make test-only
