# The services' own unit tests (OTelFeature/poc#75): the test stage of each
# service's Dockerfile, the same as `make unit-test` locally. Only Docker on
# the runner (NFR-016).
name: unit

on:
  pull_request:
    paths:
      - "src/weather/**"
      - "src/geocode/**"
      - "Makefile"
      - ".github/workflows/unit.yml"
  push:
    branches: [main]
    paths:
      - "src/weather/**"
      - "src/geocode/**"
      - "Makefile"
      - ".github/workflows/unit.yml"

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [geocode, weather]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      # The test stage fails the build when a test fails. Its own cache
      # scope, so it doesn't replace the e2e images' layers.
      - name: Unit tests (Dockerfile test stage)
        uses: docker/build-push-action@v7.4.0
        with:
          context: src/${{ matrix.service }}
          target: test
          cache-from: type=gha,scope=unit-${{ matrix.service }}
          cache-to: type=gha,scope=unit-${{ matrix.service }},mode=max
