# Flagsmith mode (UC-008 A4, TC-008 items 3 to 5): the Flagsmith proxy and
# flagd against a stub of Flagsmith Cloud, the same command as locally
# (`make flagsmith-test`). No Flagsmith credentials needed.
name: flagsmith

on:
  pull_request:
    paths:
      - "src/flagsmith-proxy/**"
      - "src/flagd/presets/**"
      - "compose.flagsmith.yaml"
      - "ci/**"
      - "Makefile"
      - ".github/workflows/flagsmith.yml"
  push:
    branches: [main]
    paths:
      - "src/flagsmith-proxy/**"
      - "src/flagd/presets/**"
      - "compose.flagsmith.yaml"
      - "ci/**"
      - "Makefile"
      - ".github/workflows/flagsmith.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      # Same image and cache scope as flags.yml and e2e.yml.
      - name: Build the toolchain image (layer cache)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ci/Dockerfile
          tags: otelfeature-e2e-runner
          load: true
          cache-from: type=gha,scope=e2e-runner
          cache-to: type=gha,scope=e2e-runner,mode=max

      - name: Proxy and flagd against the stub
        run: make flagsmith-test-only
