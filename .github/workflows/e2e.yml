name: e2e

# The talk's demo beats against the real stack (tests/e2e, OTelFeature/poc#35).
# Runs `make e2e`, the same command as locally: only Docker is needed.
on:
  pull_request:
    paths:
      - "compose*.yaml"
      - "Makefile"
      - "src/**"
      - "tests/e2e/**"
      - "ci/**"
      - ".dockerignore"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      instrument_ref:
        description: "otelfeature-instrument: exactly `release` (the pinned version), or a git ref (branch, tag or commit) to build from"
        default: release
      extension_ref:
        description: "otelfeature-java-extension: exactly `release` (the pinned version), or a git ref (branch, tag or commit) to build from"
        default: release

permissions:
  contents: read

concurrency:
  # Per event, so a nightly run and a push to main don't cancel each other;
  # only superseded PR runs are cancelled.
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e (geocode/python + weather/java ${{ matrix.enforcement }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Decision D3: both Java enforcement modes must pass the same beats.
        enforcement: [processor, sampler]
    env:
      # Pinned releases unless a git ref is passed explicitly (C-013). The
      # *_SOURCE values mirror the Makefile; the bake step reads them from
      # the environment, not through make.
      OTELFEATURE_INSTRUMENT_REF: ${{ inputs.instrument_ref || 'release' }}
      OTELFEATURE_EXTENSION_REF: ${{ inputs.extension_ref || 'release' }}
      OTELFEATURE_INSTRUMENT_SOURCE: ${{ (inputs.instrument_ref || 'release') == 'release' && 'lock' || 'git' }}
      OTELFEATURE_EXTENSION_SOURCE: ${{ (inputs.extension_ref || 'release') == 'release' && 'release' || 'git' }}
      OTELFEATURE_ENFORCEMENT: ${{ matrix.enforcement }}
      # Nightly also runs the statistical (slow) tests, and the whole suite
      # three times in a row to catch flakes (#35 acceptance criterion).
      PYTEST_ARGS: ${{ github.event_name == 'schedule' && '-v --count 3 --repeat-scope session' || '-v -m "not slow"' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      # Builds geocode, weather (pinned extension releases, or the git refs
      # passed as inputs) and the runner
      # image with the GitHub Actions layer cache, then `make e2e` uses them.
      - name: Build images (layer cache)
        uses: docker/bake-action@v7.5.0
        with:
          source: .
          files: |
            compose.yaml
            compose.e2e.yaml
          targets: geocode,weather,e2e
          load: true
          # One cache scope per image: an export replaces its scope, so a
          # shared scope would keep only the last target's layers.
          set: |
            geocode.cache-from=type=gha,scope=e2e-geocode
            geocode.cache-to=type=gha,scope=e2e-geocode,mode=max
            weather.cache-from=type=gha,scope=e2e-weather
            weather.cache-to=type=gha,scope=e2e-weather,mode=max
            e2e.cache-from=type=gha,scope=e2e-runner
            e2e.cache-to=type=gha,scope=e2e-runner,mode=max

      - name: Run the suite
        run: make e2e E2E_SKIP_BUILD=1

      - name: Upload logs and spans
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-${{ matrix.enforcement }}
          path: tests/e2e/.artifacts/
          if-no-files-found: ignore
