version: 2

updates:
  # Python dependencies for the geocode service (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/src/geocode"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Java/Gradle dependencies for the weather service
  - package-ecosystem: "gradle"
    directory: "/src/weather"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Base images used in the geocode Dockerfile
  - package-ecosystem: "docker"
    directory: "/src/geocode"
    schedule:
      interval: "weekly"

  # Base images used in the weather Dockerfile
  - package-ecosystem: "docker"
    directory: "/src/weather"
    schedule:
      interval: "weekly"

  # Image tags pinned in compose.yaml (postgres, flagd, otel-collector, k6, aspire-dashboard)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
