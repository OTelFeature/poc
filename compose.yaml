networks:
  default:
    name: otelfeature-poc
    driver: bridge

volumes:
  coordinates-db-data:

services:
  geocode:
    build:
      context: ./src/geocode
    container_name: geocode
    ports:
      - 8000:8000
    environment:
      - FLAGD_HOST=flagd
      - GEOCODE_PORT=8000
      - NOMINATIM_URL=${NOMINATIM_URL:-http://stub-apis:8080/search}
      - OTEL_SERVICE_NAME=geocode
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - POSTGRES_HOST=coordinates-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=password
      - POSTGRES_DB=coordinates
    depends_on:
      otel-collector:
        condition: service_started
      coordinates-db:
        condition: service_healthy
      flagd:
        condition: service_started
      stub-apis:
        condition: service_healthy

  weather:
    build:
      context: ./src/weather
    container_name: weather
    ports:
      - 8001:8001
    environment:
      - WEATHER_PORT=8001
      - OPEN_METEO_GEOCODING_URL=${OPEN_METEO_GEOCODING_URL:-http://stub-apis:8080/v1/search}
      - OPEN_METEO_FORECAST_URL=${OPEN_METEO_FORECAST_URL:-http://stub-apis:8080/v1/forecast}
      - OTEL_SERVICE_NAME=weather
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_INSTRUMENTATION_COMMON_EXPERIMENTAL_CONTROLLER_TELEMETRY_ENABLED=true
      - POSTGRES_HOST=coordinates-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=password
      - POSTGRES_DB=coordinates
      - FLAGD_HOST=flagd
      - FLAGD_PORT=8015
      - FLAGD_COMPILE_TARGETING=disabled
    depends_on:
      otel-collector:
        condition: service_started
      coordinates-db:
        condition: service_healthy
      flagd:
        condition: service_started
      stub-apis:
        condition: service_healthy

  load-generator:
    image: grafana/k6:2.3.0
    container_name: load-generator
    command: run --out opentelemetry /scripts/load-test.js
    volumes:
      - ./src/load-generator/load-test.js:/scripts/load-test.js
    environment:
      - GEOCODE_BASE_URL=http://geocode:8000
      - WEATHER_BASE_URL=http://weather:8001
      - REQUEST_INTERVAL_SECONDS=1
      - DURATION=15m
      - K6_OTEL_GRPC_EXPORTER_ENDPOINT=otel-collector:4317
      - K6_OTEL_GRPC_EXPORTER_INSECURE=true
      - K6_OTEL_SERVICE_NAME=load-generator
      - K6_NO_USAGE_REPORT=true
    depends_on:
      geocode:
        condition: service_started
      weather:
        condition: service_started
  
  # Offline stand-in for Nominatim and Open-Meteo (see src/stub-apis).
  # geocode and weather point at it unless `make start-live` overrides the
  # URLs above. Stdlib-only script on the image geocode is built from, so
  # there's no build step; `make prepare-offline` pulls the image.
  stub-apis:
    image: python:3.14-slim-bookworm
    container_name: stub-apis
    command: ["python", "-u", "/app/stub.py"]
    volumes:
      - ./src/stub-apis/stub.py:/app/stub.py:ro
    environment:
      - STUB_PORT=8080
      - STUB_LATENCY_MIN_MS=20
      - STUB_LATENCY_MAX_MS=120
    ports:
      - 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 10

  coordinates-db:
    image: postgres:18.6-alpine3.24
    container_name: coordinates-db
    ports:
      - 5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=coordinates
    volumes:
      - ./src/coordinates-db/init-coordinates-db.sh:/docker-entrypoint-initdb.d/init-coordinates-db.sh
      - coordinates-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coordinates"]
      interval: 2s
      timeout: 3s
      retries: 10

  flagd:
    image: ghcr.io/open-feature/flagd:v0.17.0
    container_name: flagd
    environment:
      - GOMEMLIMIT=60MiB
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=flagd
    command: [
      "start",
      "--uri",
      "file:./etc/flagd/flagd.json"
    ]
    ports:
      - 8013 # gRPC flag evaluation (rpc resolver)
      - 8015 # gRPC flag sync (in-process resolver)
      - 8016 # OFREP REST evaluation
    volumes:
      - ./src/flagd:/etc/flagd


  ########################
  # TELEMETRY COMPONENTS #
  ########################

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: otel-collector
    user: "10001:0"
    command:
      - --config=/etc/otel-collector-config.yaml
    volumes:
      - ./src/otel-collector/config.yaml:/etc/otel-collector-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 4317 # OTLP gRPC
      - 4318 # OTLP HTTP
    environment:
      - OTEL_COLLECTOR_HOST=otel-collector
      - OTEL_COLLECTOR_PORT_GRPC=4317
      - OTEL_COLLECTOR_PORT_HTTP=4318
      - DD_SITE
      - DD_API_KEY
    depends_on:
      aspire-dashboard:
        condition: service_started

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    ports:
      - 18888:18888  # Aspire UI
      - 18889        # Aspire OTLP/gRPC
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
