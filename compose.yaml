networks:
  default:
    name: otelfeature-poc
    driver: bridge

volumes:
  coordinates-db-data:

# Prebuilt images (NFR-017): every service built from this repo also names
# its image on GHCR, published from `main` by .github/workflows/images.yml.
# `docker compose pull && docker compose up -d` runs the stack without
# building anything; `docker compose up -d --build` builds from source
# instead (and tags the result with the same name, so a later `pull` replaces
# it). POC_IMAGE_TAG picks the tag: `main` or `sha-<short commit>`. The e2e
# suite always builds its own images (compose.e2e.yaml).
#
# Shared definitions for geocode/weather and their staging twins (compose
# profile `staging`). The YAML merge key `<<:` copies a mapping; keys written
# next to it win. Lists don't merge, so `environment` is a mapping here.
x-geocode: &geocode
  image: ghcr.io/otelfeature/poc-geocode:${POC_IMAGE_TAG:-main}
  build:
    context: ./src/geocode
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 2s
    timeout: 2s
    retries: 30
  depends_on: &app-depends-on
    otel-collector:
      condition: service_started
    coordinates-db:
      condition: service_healthy
    flagd:
      condition: service_started
    stub-apis:
      condition: service_healthy

x-geocode-env: &geocode-env
  FLAGD_HOST: flagd
  GEOCODE_PORT: "8000"
  WEATHER_URL: http://weather:8001
  NOMINATIM_URL: ${NOMINATIM_URL:-http://stub-apis:8080/search}
  # Stable HTTP semconv: the server span carries url.path at start (the
  # Demo 2 rule needs it; the old conventions only set http.target), and the
  # duration metric is http.server.request.duration with error.type.
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  OTEL_SERVICE_NAME: geocode
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  POSTGRES_HOST: coordinates-db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_PWD: password
  POSTGRES_DB: coordinates

x-weather: &weather
  image: ghcr.io/otelfeature/poc-weather:${POC_IMAGE_TAG:-main}
  build:
    context: ./src/weather
  # The JVM plus agent takes a while; k6 waits for this.
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8001/health"]
    interval: 2s
    timeout: 2s
    retries: 60
  depends_on: *app-depends-on

x-weather-env: &weather-env
  WEATHER_PORT: "8001"
  OPEN_METEO_GEOCODING_URL: ${OPEN_METEO_GEOCODING_URL:-http://stub-apis:8080/v1/search}
  OPEN_METEO_FORECAST_URL: ${OPEN_METEO_FORECAST_URL:-http://stub-apis:8080/v1/forecast}
  OTEL_SERVICE_NAME: weather
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_INSTRUMENTATION_COMMON_EXPERIMENTAL_CONTROLLER_TELEMETRY_ENABLED: "true"
  POSTGRES_HOST: coordinates-db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_PWD: password
  POSTGRES_DB: coordinates
  FLAGD_HOST: flagd
  FLAGD_PORT: "8015"
  FLAGD_COMPILE_TARGETING: disabled

services:
  # Each service sets its own semconv resource attributes, so the SDK-side
  # flag decision sees them (the collector only fills in what's missing).
  # service.version matches `version` in src/geocode/pyproject.toml and
  # src/weather/build.gradle. service.instance.id is the container name, so
  # Aspire lists prod and staging as distinguishable instances.
  geocode:
    <<: *geocode
    container_name: geocode
    ports:
      - 8000:8000
    environment:
      <<: *geocode-env
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.namespace=otelfeature,service.version=0.1.0,service.instance.id=geocode

  weather:
    <<: *weather
    container_name: weather
    ports:
      - 8001:8001
    environment:
      <<: *weather-env
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.namespace=otelfeature,service.version=0.1.0,service.instance.id=weather

  # Staging twins: same image and config, deployment.environment.name=staging.
  # Only started with `--profile staging` (`make start-staging`). They run
  # the same image as geocode and weather, so there is nothing extra to pull.
  geocode-staging:
    <<: *geocode
    profiles: [staging]
    container_name: geocode-staging
    ports:
      - 8002:8000
    environment:
      <<: *geocode-env
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=staging,service.namespace=otelfeature,service.version=0.1.0,service.instance.id=geocode-staging
      # The cross-service path stays in its environment.
      WEATHER_URL: http://weather-staging:8001

  weather-staging:
    <<: *weather
    profiles: [staging]
    container_name: weather-staging
    ports:
      - 8003:8001
    environment:
      <<: *weather-env
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=staging,service.namespace=otelfeature,service.version=0.1.0,service.instance.id=weather-staging

  load-generator:
    image: grafana/k6:2.3.0
    container_name: load-generator
    command: run --out opentelemetry /scripts/load-test.js
    volumes:
      - ./src/load-generator/load-test.js:/scripts/load-test.js
    environment:
      - GEOCODE_BASE_URL=http://geocode:8000
      - WEATHER_BASE_URL=http://weather:8001
      - FORECAST_INTERVAL_SECONDS=15
      - REQUEST_INTERVAL_SECONDS=1
      - DURATION=15m
      - HEALTHCHECK_RATE=2
      - K6_OTEL_GRPC_EXPORTER_ENDPOINT=otel-collector:4317
      - K6_OTEL_GRPC_EXPORTER_INSECURE=true
      - K6_OTEL_SERVICE_NAME=load-generator
      - K6_NO_USAGE_REPORT=true
    depends_on:
      geocode:
        condition: service_healthy
      weather:
        condition: service_healthy
  
  # Second k6 instance for the staging profile, same script and rate.
  load-generator-staging:
    profiles: [staging]
    image: grafana/k6:2.3.0
    container_name: load-generator-staging
    command: run --out opentelemetry /scripts/load-test.js
    volumes:
      - ./src/load-generator/load-test.js:/scripts/load-test.js
    environment:
      - GEOCODE_BASE_URL=http://geocode-staging:8000
      - WEATHER_BASE_URL=http://weather-staging:8001
      - FORECAST_INTERVAL_SECONDS=15
      - REQUEST_INTERVAL_SECONDS=1
      - DURATION=15m
      - HEALTHCHECK_RATE=2
      - K6_OTEL_GRPC_EXPORTER_ENDPOINT=otel-collector:4317
      - K6_OTEL_GRPC_EXPORTER_INSECURE=true
      - K6_OTEL_SERVICE_NAME=load-generator-staging
      - K6_NO_USAGE_REPORT=true
    depends_on:
      geocode-staging:
        condition: service_healthy
      weather-staging:
        condition: service_healthy

  # Offline stand-in for Nominatim and Open-Meteo (see src/stub-apis).
  # geocode and weather point at it unless `make start-live` overrides the
  # URLs above. A stdlib-only script baked into a stock Python image.
  stub-apis:
    image: ghcr.io/otelfeature/poc-stub-apis:${POC_IMAGE_TAG:-main}
    build:
      context: ./src/stub-apis
    container_name: stub-apis
    environment:
      - STUB_PORT=8080
      - STUB_LATENCY_MIN_MS=20
      - STUB_LATENCY_MAX_MS=120
    ports:
      - 8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 2s
      retries: 10

  coordinates-db:
    image: postgres:18.6-alpine3.24
    container_name: coordinates-db
    ports:
      - 5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=coordinates
    volumes:
      - ./src/coordinates-db/init-coordinates-db.sh:/docker-entrypoint-initdb.d/init-coordinates-db.sh
      - coordinates-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coordinates"]
      interval: 2s
      timeout: 3s
      retries: 10

  flagd:
    image: ghcr.io/open-feature/flagd:v0.18.2
    container_name: flagd
    environment:
      - GOMEMLIMIT=60MiB
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=flagd
    command: [
      "start",
      "--uri",
      "file:./etc/flagd/flagd.json"
    ]
    ports:
      - 8013 # gRPC flag evaluation (rpc resolver)
      - 8015 # gRPC flag sync (in-process resolver)
      - 8016 # OFREP REST evaluation
    volumes:
      - ./src/flagd:/etc/flagd

  # Stage control without make (NFR-017, UC-008 BR-007):
  #   docker compose run --rm flag 02-quiet-noise
  # Applies a preset like `make flag` (src/flagd/apply-preset.sh: atomic
  # rename, strictly newer mtime) and then waits until flagd serves it over
  # OFREP (src/flagd/flag.sh). Profile `tools`, so `up` never starts it.
  flag:
    profiles: [tools]
    image: busybox:1.38.0
    entrypoint: ["sh", "/flagd/flag.sh"]
    volumes:
      - ./src/flagd:/flagd
    environment:
      FLAGD_OFREP_URL: ${FLAGD_OFREP_URL:-http://flagd:8016}
      FLAG_CONFIRM_TIMEOUT: ${FLAG_CONFIRM_TIMEOUT:-10}


  ########################
  # TELEMETRY COMPONENTS #
  ########################

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: otel-collector
    # root, so the docker_stats receiver can read the Docker socket. As
    # 10001 it works on Docker Desktop, but on a native engine (WSL2, Linux)
    # the socket is root:docker 660, the receiver fails to start, and the
    # collector exits: no telemetry at all.
    user: "0:0"
    command:
      - --config=/etc/otel-collector-config.yaml
    volumes:
      - ./src/otel-collector/config.yaml:/etc/otel-collector-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 4317 # OTLP gRPC
      - 4318 # OTLP HTTP
    environment:
      - OTEL_COLLECTOR_HOST=otel-collector
      - OTEL_COLLECTOR_PORT_GRPC=4317
      - OTEL_COLLECTOR_PORT_HTTP=4318
      - DD_SITE
      - DD_API_KEY
    depends_on:
      aspire-dashboard:
        condition: service_started

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    ports:
      - 18888:18888  # Aspire UI
      - 18889        # Aspire OTLP/gRPC
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
